spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/catalog/**
          filters:
            - name: JwtAuthentication

        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - name: JwtAuthentication

        - id: pricing-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/pricing/**
          filters:
            - name: JwtAuthentication

        - id: cart-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - name: JwtAuthentication

        - id: wishlist-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/wishlist/**
          filters:
            - name: JwtAuthentication

        - id: order-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: JwtAuthentication

        - id: payment-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: JwtAuthentication

        - id: shipping-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/shipping/**
          filters:
            - name: JwtAuthentication

        - id: notification-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthentication

        - id: review-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - name: JwtAuthentication

        - id: search-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: JwtAuthentication

        - id: analytics-service
          uri: http://localhost:8095
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthentication

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
