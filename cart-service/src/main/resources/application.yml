spring:
  application:
    name: cart-service

  profiles:
    active: dev

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
