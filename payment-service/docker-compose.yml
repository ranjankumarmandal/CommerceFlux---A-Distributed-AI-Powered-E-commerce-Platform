version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: payment-postgres
    restart: always
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - commerce-network

  redis:
    image: redis:7
    container_name: payment-redis
    restart: always
    ports:
      - "6385:6379"
    networks:
      - commerce-network

volumes:
  postgres-data:

networks:
  commerce-network:
