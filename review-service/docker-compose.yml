version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: review-postgres
    restart: always
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - commerce-network

volumes:
  postgres-data:

networks:
  commerce-network:
