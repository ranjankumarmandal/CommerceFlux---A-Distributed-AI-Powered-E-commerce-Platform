spring:
  application:
    name: review-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/review_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
