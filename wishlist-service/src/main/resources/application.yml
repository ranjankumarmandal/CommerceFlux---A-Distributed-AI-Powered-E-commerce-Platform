spring:
  application:
    name: wishlist-service

  profiles:
    active: dev

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  datasource:
    url: jdbc:postgresql://localhost:5432/wishlist_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
